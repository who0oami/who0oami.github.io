<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cup & Go — 화면 미리보기</title>
<meta name="description" content="Cup & Go React Native 프로젝트의 화면 구성을 브라우저에서 재현한 인터랙티브 미리보기. 실제 앱 빌드/SQLite/서버 주문과는 별개입니다.">
<style>
:root{--bg:#faf8f5;--ink:#24312b;--sub:#899189;--green:#426a51;--deep:#2c4b3a;--mint:#e5efe6;--orange:#ed744c;--line:#e8eae5;--white:#fff}
*{box-sizing:border-box}html,body{margin:0}body{background:#f6f7f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;min-width:320px}
.wrapper{display:flex;gap:36px;align-items:flex-start;justify-content:center;padding:35px 22px 54px;flex-wrap:wrap}.intro{width:280px;padding-top:68px}.intro .label{display:inline-block;color:#3182f6;font-size:11px;font-weight:800;letter-spacing:1px}.intro h1{font-size:35px;line-height:1.2;margin:15px 0 17px;letter-spacing:-1.6px}.intro p{font-size:14px;line-height:1.85;color:#65707c}.intro .tips{font-size:12px;padding:17px;background:#fff;border:1px solid #e5e8eb;border-radius:15px;margin-top:27px;line-height:1.9;color:#52606c}.intro a{color:#3182f6;text-decoration:none;font-weight:700}.legend{color:#8b95a1;font-size:11px;margin:16px 0}
.phone-wrap{width:min(100%,404px);flex-shrink:0}.phone{width:100%;height:820px;display:flex;flex-direction:column;border:8px solid #23282c;border-radius:45px;overflow:hidden;background:var(--bg);box-shadow:0 24px 62px #191f2830;position:relative}.status{height:29px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:11px;font-weight:800;background:var(--bg)}.screen{flex:1;overflow-y:auto;scrollbar-width:thin}.screen::-webkit-scrollbar{width:3px}.screen::-webkit-scrollbar-thumb{background:#dae2d9}.bottom{height:70px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;flex-shrink:0;padding-bottom:8px}.bottom button{border:0;background:none;color:#97a19b;font-size:11px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:center}.bottom button.active{color:var(--green)}.bottom button .navicon{font-size:21px;font-weight:600}.pad{padding:18px 20px 25px}.row{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;letter-spacing:-2px;font-weight:900;color:var(--deep)}.brand em{font-style:normal;color:var(--orange)}.place{color:var(--sub);font-size:10px;margin-top:0}.bag{width:43px;height:43px;border-radius:16px;border:1px solid var(--line);background:white;cursor:pointer;font-size:24px;color:var(--deep);position:relative}.bag span{position:absolute;right:-3px;top:-7px;font-size:10px;background:var(--orange);color:white;padding:3px 6px;border-radius:12px}.hero{background:var(--deep);border-radius:24px;color:#fff;min-height:175px;margin:24px 0 28px;padding:21px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;position:relative}.hero .eyebrow{color:#bfd2c6;font-size:7px;font-weight:800;letter-spacing:1.3px}.hero h2{font-size:21px;margin:13px 0 11px;line-height:1.47;letter-spacing:-.7px}.hero p{color:#d6e2d9;font-size:10px;margin:0}.cup-graphic{background:#5d8069;width:103px;height:103px;flex-shrink:0;border-radius:100%;display:grid;place-items:center;font-size:58px}.eyebrow{color:var(--orange);font-size:9px;font-weight:800;letter-spacing:1.3px}.headline{font-size:20px;margin:6px 0 15px;letter-spacing:-.5px}.searchbox{display:flex;align-items:center;gap:10px;height:46px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 14px;margin-bottom:14px}.searchbox span{color:var(--green);font-size:23px}.searchbox input{border:0;outline:0;flex:1;min-width:0;font:inherit;font-size:12px;color:var(--ink)}.chips{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto}.chip{white-space:nowrap;padding:10px 16px;font-size:11px;border:1px solid var(--line);background:#fff;border-radius:20px;color:#778379;cursor:pointer}.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.menu-card{border:1px solid #f0f0ec;border-radius:20px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;padding:0}.tile-art{height:132px;display:grid;place-items:center;position:relative;font-size:52px}.pill{position:absolute;top:11px;left:10px;padding:5px 8px;background:#fff;border-radius:7px;font-size:8px;font-weight:900;letter-spacing:.6px;color:var(--deep)}.tile-copy{padding:12px}.item-name{font-size:13px;font-weight:800}.english{color:var(--sub);font-size:10px;margin-top:4px}.tile-foot{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.price{font-size:13px;font-weight:800}.plus{border-radius:50%;width:27px;height:27px;background:var(--mint);color:var(--deep);display:grid;place-items:center;font-size:20px}.disclaimer{font-size:10px;color:#9da59e;line-height:1.6;text-align:center;margin:23px 0 0}
.detail-head{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 15px}.top-btn{width:38px;height:38px;background:white;border:1px solid var(--line);border-radius:14px;color:var(--deep);font-size:24px;cursor:pointer}.detail-title{font-size:14px;font-weight:800}.detail-visual{height:254px;border-radius:25px;display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:25px}.detail-visual:before{content:'';position:absolute;width:195px;height:195px;border-radius:50%;background:#ffffff50}.detail-visual .emoji{font-size:108px;position:relative}.detail-art{padding:0 21px}.detail-main{padding:0 22px}.detail-main h1{font-size:26px;margin:11px 0 0;letter-spacing:-1px}.detail-main .en{font-size:13px;color:var(--sub);margin-top:3px}.detail-main .desc{color:#626c64;font-size:13px;line-height:1.85;margin:19px 0}.separator{height:1px;background:var(--line);margin:22px 0}.qrow{display:flex;align-items:center;justify-content:space-between}.qrow strong{font-size:14px}.qrow small{font-size:10px;color:var(--sub);display:block;margin-top:5px}.qty{display:flex;align-items:center;gap:11px}.qty button{height:27px;width:27px;background:#f1f1ed;border:0;border-radius:50%;cursor:pointer;color:var(--deep);font-size:17px}.qty span{font-size:13px;font-weight:800;min-width:12px;text-align:center}.hint{margin:28px 0 15px;padding:18px;border-radius:16px;background:var(--mint);display:flex;gap:12px;color:var(--deep)}.hint .icon{font-size:21px}.hint strong{font-size:12px}.hint p{color:#66816d;font-size:10px;line-height:1.6;margin:5px 0 0}.action-area{border-top:1px solid var(--line);background:#fff;padding:12px 20px}.action{border:0;border-radius:14px;cursor:pointer;width:100%;background:var(--green);color:#fff;padding:17px 16px;font:inherit;font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.action span{font-size:13px}.action:hover{background:var(--deep)}.cart-title{font-size:27px;font-weight:900;margin:7px 0}.cart-title span{color:var(--green);font-size:18px}.cart-head{padding:24px 22px}.clear{font-size:11px;color:var(--sub);border:0;background:transparent;text-decoration:underline;cursor:pointer}.cart-pad{padding:3px 20px 22px}.cart-pad h3{font-size:15px}.cartline{display:flex;gap:13px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:11px;margin:12px 0}.cartart{width:87px;height:90px;flex-shrink:0;border-radius:15px;display:grid;place-items:center;font-size:45px}.cartbody{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}.carttop{display:flex;justify-content:space-between;gap:5px}.carttop strong{font-size:12px}.delete{border:0;background:none;color:var(--sub);cursor:pointer}.cartbottom{display:flex;justify-content:space-between;align-items:center}.receipt{background:#fff;border:1px solid var(--line);border-radius:19px;padding:19px;margin-top:26px}.receipt h3{margin:0 0 22px}.receiptrow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:15px}.receiptrow small{font-size:12px;color:var(--sub)}.total{font-size:18px;font-weight:900;color:var(--deep)}.empty{text-align:center;padding:85px 25px;color:var(--sub)}.empty .circle{height:142px;width:142px;background:var(--mint);border-radius:50%;display:grid;place-items:center;font-size:64px;margin:0 auto 25px}.empty h2{font-size:19px;color:var(--ink)}.empty p{font-size:12px;line-height:1.7}.empty .action{margin-top:30px;justify-content:center}.previewlabel{color:#8b95a1;font-size:10px;text-align:center;margin-top:16px}
@media(max-width:760px){.wrapper{padding:16px 14px 32px;gap:17px}.intro{width:min(100%,404px);padding-top:4px}.intro h1{font-size:24px;margin:7px 0}.intro p{margin:0;font-size:12px}.intro .tips{display:none}.phone{height:730px;border-radius:34px;border-width:6px}.phone-wrap{max-width:404px}.legend{margin:4px 0}}
</style>
</head>
<body>
<div class="wrapper">
  <aside class="intro"><span class="label">CUP &amp; GO · UI WALKTHROUGH</span><h1>작은 카페 앱의<br>세 가지 화면.</h1><p>React Native 소스의 메뉴 데이터·색상·화면 구성을 웹에서 재현했습니다. 카드를 누르거나 장바구니 수량을 조절해 보세요.</p><div class="tips"><strong>미리보기 사용법</strong><br>① 메뉴 카드 선택 → 상세<br>② 수량 선택 → 장바구니<br>③ 담은 메뉴 수정 또는 삭제<br><br>실제 Expo 앱이 아니라 브라우저 시연용 화면입니다. 주문·결제·서버 DB는 사용하지 않습니다.</div></aside>
  <section class="phone-wrap" aria-label="Cup and Go 화면 미리보기"><div class="phone"><div class="status"><span>9:41</span><span>●●●  ▰</span></div><main id="screen" class="screen"></main><div id="action-area"></div><nav id="bottom" class="bottom" aria-label="화면 전환"></nav></div><p class="previewlabel">UI 시뮬레이션 · 실제 iOS/Android 실행 캡처가 아닙니다</p></section>
</div>
<script id="menu-data" type="application/json">[{"id": "espresso", "name": "클래식 에스프레소", "englishName": "Classic Espresso", "category": "coffee", "description": "깊고 진한 초콜릿 향과 고소한 여운이 남는 시그니처 에스프레소.", "price": 3800, "emoji": "☕", "background": "#E9D6C4", "badge": "BEST"}, {"id": "latte", "name": "바닐라 빈 라떼", "englishName": "Vanilla Bean Latte", "category": "coffee", "description": "마다가스카르 바닐라와 부드러운 우유가 어우러진 달콤한 라떼.", "price": 5200, "emoji": "🥛", "background": "#F2E6D2", "badge": "POPULAR"}, {"id": "americano", "name": "아이스 아메리카노", "englishName": "Iced Americano", "category": "coffee", "description": "산뜻한 산미와 균형 잡힌 바디감, 매일 마시기 좋은 커피.", "price": 4200, "emoji": "🧊", "background": "#DCE6EA", "badge": null}, {"id": "matcha", "name": "제주 말차 라떼", "englishName": "Jeju Matcha Latte", "category": "noncoffee", "description": "진한 제주 말차와 고소한 우유의 깔끔한 조화.", "price": 5800, "emoji": "🍵", "background": "#DBE8D6", "badge": "NEW"}, {"id": "lemonade", "name": "레몬 스파클링", "englishName": "Lemon Sparkling", "category": "noncoffee", "description": "생레몬의 상큼함을 톡톡 터지는 탄산에 담았어요.", "price": 5500, "emoji": "🍋", "background": "#F5E8B9", "badge": null}, {"id": "croissant", "name": "버터 크루아상", "englishName": "Butter Croissant", "category": "bakery", "description": "겹겹이 결이 살아 있는 프랑스산 버터 크루아상.", "price": 3900, "emoji": "🥐", "background": "#F0DEC7", "badge": "BEST"}, {"id": "cookie", "name": "초코칩 쿠키", "englishName": "Chocolate Chip Cookie", "category": "bakery", "description": "진한 다크초콜릿과 브라운 버터를 넣은 꾸덕한 쿠키.", "price": 3200, "emoji": "🍪", "background": "#EAD6C4", "badge": null}]</script>
<script>
const menu=JSON.parse(document.getElementById('menu-data').textContent);
const byId=Object.fromEntries(menu.map(i=>[i.id,i]));
const query=new URLSearchParams(location.search);
const startScreen=query.get('screen');
const state={view:startScreen==='cart'?'cart':startScreen==='detail'?'detail':'menu',filter:'all',search:'',detailId:'latte',quantity:1,cart:startScreen==='cart'?{latte:2,croissant:1}:{},placed:false};
const screen=document.getElementById('screen'), bottom=document.getElementById('bottom'), actionArea=document.getElementById('action-area');
const money=n=>new Intl.NumberFormat('ko-KR').format(n)+'원';
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const count=()=>Object.values(state.cart).reduce((sum,n)=>sum+n,0);
const total=()=>Object.entries(state.cart).reduce((sum,[id,n])=>sum+(byId[id]?.price||0)*n,0);
const qty=(value,type,id)=>`<div class="qty"><button type="button" data-action="${type}" data-id="${id}" data-n="-1" aria-label="수량 감소">−</button><span>${value}</span><button type="button" data-action="${type}" data-id="${id}" data-n="1" aria-label="수량 증가">+</button></div>`;
function navigation(){return `<button data-action="go-menu" class="${state.view==='menu'?'active':''}"><span class="navicon">⌂</span>메뉴</button><button data-action="go-cart" class="${state.view==='cart'?'active':''}"><span class="navicon">▢</span>장바구니 ${count()?'('+count()+')':''}</button>`}
function menuPage(){const filtered=menu.filter(i=>(state.filter==='all'||i.category===state.filter)&&(i.name+' '+i.englishName).toLowerCase().includes(state.search.toLowerCase()));return `<div class="pad"><div class="row"><div><div class="brand">cup<em>&amp;</em>go<em>.</em></div><div class="place">⌁ 서울 강남구 · 픽업 주문</div></div><button class="bag" data-action="go-cart" aria-label="장바구니 열기">▢${count()?'<span>'+count()+'</span>':''}</button></div><div class="hero"><div><div class="eyebrow">YOUR DAILY COFFEE MOMENT</div><h2>기다림 없이,<br>커피는 여유롭게.</h2><p>한 잔의 행복을 미리 준비해둘게요.</p></div><div class="cup-graphic">☕</div></div><div class="eyebrow">FIND YOUR FAVORITE</div><h2 class="headline">오늘은 무엇을 마실까요? ✳</h2><label class="searchbox"><span>⌕</span><input id="search" placeholder="메뉴를 검색해 보세요" aria-label="메뉴 검색" value="${esc(state.search)}"></label><div class="chips">${[['all','전체'],['coffee','커피'],['noncoffee','논커피'],['bakery','베이커리']].map(([v,label])=>`<button data-action="filter" data-id="${v}" class="chip ${state.filter===v?'on':''}">${label}</button>`).join('')}</div><div class="grid">${filtered.map(item=>`<button class="menu-card" data-action="detail" data-id="${item.id}"><div class="tile-art" style="background:${item.background}">${item.badge?'<span class="pill">'+esc(item.badge)+'</span>':''}<span>${esc(item.emoji)}</span></div><div class="tile-copy"><div class="item-name">${esc(item.name)}</div><div class="english">${esc(item.englishName)}</div><div class="tile-foot"><span class="price">${money(item.price)}</span><span class="plus">+</span></div></div></button>`).join('')||'<p>검색 결과가 없어요.</p>'}</div><p class="disclaimer">학습용 화면 미리보기 · 실제 주문 및 결제는 진행되지 않아요.</p></div>`}
function detailPage(){const i=byId[state.detailId]||menu[0];return `<div class="detail-head"><button class="top-btn" data-action="go-menu" aria-label="뒤로">‹</button><span class="detail-title">메뉴 상세</span><button class="top-btn" data-action="go-cart" aria-label="장바구니">▢</button></div><div class="detail-art"><div class="detail-visual" style="background:${i.background}">${i.badge?'<span class="pill">'+esc(i.badge)+'</span>':''}<span class="emoji">${esc(i.emoji)}</span></div></div><div class="detail-main"><div class="eyebrow">MADE WITH CARE, JUST FOR YOU</div><h1>${esc(i.name)}</h1><div class="en">${esc(i.englishName)}</div><p class="desc">${esc(i.description)}</p><div class="separator"></div><div class="qrow"><div><strong>수량 선택</strong><small>한 번에 최대 20개까지 담을 수 있어요.</small></div>${qty(state.quantity,'detail-qty',i.id)}</div><div class="hint"><span class="icon">✳</span><div><strong>픽업 주문 연습</strong><p>실제 결제는 진행되지 않는 포트폴리오 데모입니다.</p></div></div></div>`}
function cartPage(){const rows=Object.entries(state.cart).filter(([,n])=>n>0);return `<div class="cart-head row"><div><div class="eyebrow">YOUR ORDER</div><h1 class="cart-title">장바구니 <span>(${count()})</span></h1></div>${rows.length?'<button class="clear" data-action="clear">전체 비우기</button>':''}</div>${!rows.length?`<div class="empty"><div class="circle">${state.placed?'🎉':'🛍️'}</div><h2>${state.placed?'데모 주문 완료!':'아직 담긴 메뉴가 없어요'}</h2><p>${state.placed?'미리보기에서 주문 과정을 시뮬레이션했어요. 실제 서버에는 저장되지 않습니다.':'오늘의 커피를 골라 장바구니에 담아보세요.'}</p><button class="action" data-action="go-menu">메뉴 보러 가기 →</button></div>`:`<div class="cart-pad"><h3>담은 메뉴</h3>${rows.map(([id,n])=>{const i=byId[id];return `<div class="cartline"><div class="cartart" style="background:${i.background}">${esc(i.emoji)}</div><div class="cartbody"><div><div class="carttop"><strong>${esc(i.name)}</strong><button class="delete" data-action="remove" data-id="${id}" aria-label="${esc(i.name)} 삭제">✕</button></div><div class="english">${esc(i.englishName)}</div></div><div class="cartbottom"><strong class="price">${money(i.price*n)}</strong>${qty(n,'cart-qty',id)}</div></div></div>`}).join('')}<div class="receipt"><h3>주문 요약</h3><div class="receiptrow"><small>상품 금액</small><strong>${money(total())}</strong></div><div class="receiptrow"><small>픽업 수수료</small><strong style="color:var(--green)">무료</strong></div><div class="separator"></div><div class="receiptrow"><strong>총 금액</strong><strong class="total">${money(total())}</strong></div></div><p class="disclaimer">이 웹 미리보기는 브라우저 메모리에서만 장바구니를 관리합니다. 실제 앱 버전의 SQLite나 주문 서버에 연결되지 않습니다.</p></div>`}`}
function render(){screen.innerHTML=state.view==='detail'?detailPage():state.view==='cart'?cartPage():menuPage();actionArea.className='';actionArea.innerHTML=state.view==='detail'?`<div class="action-area"><button class="action" data-action="add">장바구니에 담기 → <span>${money((byId[state.detailId]||menu[0]).price*state.quantity)}</span></button></div>`:state.view==='cart'&&count()?`<div class="action-area"><button class="action" data-action="checkout">데모 주문 체험 → <span>${money(total())}</span></button></div>`:'';bottom.innerHTML=navigation()}
function go(view){state.view=view;screen.scrollTop=0;render()}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id,n=Number(b.dataset.n);switch(action){case'go-menu':go('menu');break;case'go-cart':go('cart');break;case'filter':state.filter=id;render();break;case'detail':state.detailId=id;state.quantity=1;go('detail');break;case'detail-qty':state.quantity=Math.max(1,Math.min(20,state.quantity+n));render();break;case'cart-qty':state.cart[id]=Math.max(0,Math.min(20,(state.cart[id]||0)+n));if(!state.cart[id])delete state.cart[id];render();break;case'remove':delete state.cart[id];render();break;case'clear':state.cart={};state.placed=false;render();break;case'add':state.cart[state.detailId]=Math.min(20,(state.cart[state.detailId]||0)+state.quantity);state.placed=false;go('cart');break;case'checkout':state.placed=true;state.cart={};go('cart');break}});
document.addEventListener('input',event=>{if(event.target.id==='search'){const value=event.target.value,sel=event.target.selectionStart;state.search=value;render();const target=document.getElementById('search');if(target){target.focus();target.setSelectionRange(sel,sel)}}});
render();
</script>
</body></html>
